# Manifest to create the Slack app of ONE agent.
# On https://api.slack.com/apps > Create New App > From a manifest > pick the workspace,
# paste this text and replace AGENT_NAME (twice) with the agent's name, e.g. Researcher.
# Repeat for every agent. For an existing app: open it > App Manifest > paste > Save Changes,
# then reinstall it when Slack asks.

display_information:
  name: AGENT_NAME
  description: AI agent connected from my computer
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: AGENT_NAME
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - files:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
